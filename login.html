<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metalibros | Login</title>
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/login.css">
  </head>
  <body>
    <nav class="navbar" aria-label="Navegación principal">
      <a class="navbar__logo" href="/index.html">
        <img src="assets/images/brand/metalibros.png" alt="Metalibros Logo">
      </a>
    </nav>

    <main class="login-page">
      <section class="login-card" aria-label="Formulario de ingreso">
        <div class="login-card__header">
          <h1 class="login-card__title">Inicia sesión</h1>
        </div>

        <form class="login-form">
          <div class="login-form__field">
            <label class="login-form__label" for="email">Correo electrónico</label>
            <input class="login-form__input" id="email" type="email">
          </div>

          <div class="login-form__field">
            <label class="login-form__label" for="password">Contraseña</label>
            <input class="login-form__input" id="password" type="password">
          </div>

          <div class="login-form__options">
            <a href="#" class="login-form__link">¿Olvidaste tu contraseña?</a>
          </div>

          <a class="login-form__button button-gradient" href="/dashboard.html">Entrar</a>
        </form>
      </section>
    </main>
  </body>
</html>
