<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metalibros | Configuración de Perfil</title>
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/sidebar.css">
    <link rel="stylesheet" href="/assets/css/profile.css">
  </head>
  <body>
    <main class="profile-page">
      <aside class="sidebar" aria-label="Sidebar de navegación">
        <div class="sidebar__header">
          <a class="navbar__logo" href="/index.html">
            <img src="/assets/images/brand/metalibros.png" alt="Metalibros Logo">
          </a>
        </div>
        <nav class="sidebar__nav">
          <a class="sidebar__item" href="/dashboard.html">Dashboard</a>
          <a class="sidebar__item" href="/book-list.html">Libros Publicados</a>
          <a class="sidebar__item" href="/book-register.html">Registro de Libros</a>
          <a class="sidebar__item" href="/book-admin.html">Administración de Libros</a>
        </nav>

        <div class="sidebar__footer">
          <a class="sidebar__item sidebar__item--active" href="/profile.html">Configurar perfil</a>
        </div>
      </aside>

      <section class="profile-content">
        <nav class="profile__header">
          <h1 class="profile__header-title">Perfil de usuario</h1>
        </nav>

        <div class="profile__form-wrapper">
          <div class="profile__card">
            <div class="profile__avatar-wrap">
              <label class="profile__avatar" for="profile-photo" aria-label="Cambiar foto de perfil">
                <img src="/assets/images/profile.png" alt="Foto de perfil del usuario">
                <span class="profile__change">+</span>
              </label>
              <input id="profile-photo" type="file" accept="image/*" hidden>
            </div>

            <form class="profile__form">
              <div class="profile__field profile__field--full">
                <label for="full-name">Nombre completo</label>
                <input id="full-name" name="full-name" type="text" value="Mauricio Matias" placeholder="Tu nombre completo">
              </div>

              <div class="profile__field profile__field--full">
                <label for="bio">Biografía</label>
                <textarea id="bio" name="bio" rows="2" placeholder="Escribe una breve biografía...">
Amante de la tecnología, el pensamiento crítico y el crecimiento personal constante.
                </textarea>
              </div>

              <div class="profile__field">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" value="mmatias" placeholder="Tu username">
              </div>

              <div class="profile__field">
                <label for="email">Correo</label>
                <input id="email" name="email" type="email" value="mauricio@metalibros.com" disabled>
              </div>

              <div class="profile__field profile__field--full">
                <label for="birth-date">Fecha de nacimiento</label>
                <input id="birth-date" name="birth-date" type="date" value="1996-04-19" disabled>
              </div>

              <div class="profile__actions">
                <a href="/dashboard.html" class="profile__button profile__button--primary">Guardar cambios</a>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
